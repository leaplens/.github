name: 機能要望
description: 新機能・改善提案
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 課題 / 動機
      description: 何が困っていて、なぜ必要か
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: どう解決したいか (具体案 or アイデアレベルで OK)
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 他にどんなアプローチがあるか / なぜそれを選ばないか
