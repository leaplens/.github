name: CI

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # @leaplens スコープのパッケージを GitHub Packages から取得する場合のみ
  # packages: read

jobs:
  # ジョブ名は org 共通で `ci` に揃える (ルールセットの必須チェックで参照するため)
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # env:
    #   NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: leaplens/.github/actions/setup-pnpm-node@main

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
